name: Rust

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "assets/icon*"
      - "macos/entitlements.plist"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Select Xcode 26 for Swift 6.2 FluidAudio traits (macOS)
        if: runner.os == 'macOS'
        run: |
          selected=""
          for x in /Applications/Xcode_26.*.app; do
            if [[ -d "$x" ]]; then
              selected="$x"
            fi
          done
          if [[ -n "$selected" ]]; then
            sudo xcode-select -s "$selected/Contents/Developer"
          fi
          swift --version
          echo "PULSESCRIBE_SWIFT_SCRATCH_DIR=$HOME/.swiftpm-scratch" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache SwiftPM FluidAudio bridge (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm-scratch
          key: swiftpm-${{ runner.os }}-${{ hashFiles('crates/local-asr/swift/Package*.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy (local ASR backends)
        run: cargo clippy -p pulsescribe-local-asr -p pulsescribe-daemon -p pulsescribe-cli -p pulsescribe-desktop --features all-local --all-targets -- -D warnings

      - name: Run tests (local ASR backends)
        run: cargo test -p pulsescribe-local-asr -p pulsescribe-daemon -p pulsescribe-cli -p pulsescribe-desktop --features all-local
