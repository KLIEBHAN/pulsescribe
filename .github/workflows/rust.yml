name: Rust

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/golden/**"
      - "refine/prompts.py"
      - "ui/animation.py"
      - "ui/daemon_status_feedback.py"
      - "ui/overlay_feedback.py"
      - "ui/overlay_style.py"
      - "ui/overlay_text.py"
      - "utils/atomic_io.py"
      - "utils/custom_prompts.py"
      - "utils/env.py"
      - "utils/file_signatures.py"
      - "utils/history.py"
      - "utils/hold_state.py"
      - "utils/hotkey.py"
      - "utils/hotkey_validation.py"
      - "utils/hotkey_windows.py"
      - "utils/log_tail.py"
      - "utils/onboarding.py"
      - "utils/paths.py"
      - "utils/preferences.py"
      - "utils/state.py"
      - "utils/text_preview.py"
      - "utils/transcript_delivery.py"
      - "utils/vocabulary.py"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy (local ASR backends)
        run: cargo clippy -p pulsescribe-local-asr -p pulsescribe-daemon -p pulsescribe-cli --features all-local --all-targets -- -D warnings

      - name: Run tests (local ASR backends)
        run: cargo test -p pulsescribe-local-asr --features all-local
