name: Build Installers

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/build-installers.yml
      - assets/**
      - audio/**
      - build_app.sh
      - build_app.spec
      - build_dmg.sh
      - build_windows.ps1
      - build_windows.spec
      - cli/**
      - config.py
      - installer_windows.iss
      - macos/**
      - providers/**
      - pulsescribe_daemon.py
      - pulsescribe_windows.py
      - pyproject.toml
      - refine/**
      - requirements.txt
      - transcribe.py
      - ui/**
      - utils/**
      - whisper_platform/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.3.0)
        required: true
        type: string
      upload_to_release:
        description: Upload the built installers to the existing GitHub release
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: Replace same-named release assets (manual runs only)
        required: true
        default: false
        type: boolean
      build_windows_local:
        description: Build and optionally publish the large Local Whisper installer
        required: true
        default: false
        type: boolean

concurrency:
  group: installers-${{ github.event.release.tag_name || inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
      clobber: ${{ steps.release.outputs.clobber }}
      build_windows_local: ${{ steps.release.outputs.build_windows_local }}
    env:
      REQUESTED_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.event.pull_request.head.sha || github.ref_name }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      UPLOAD_TO_RELEASE: ${{ inputs.upload_to_release || 'false' }}
      REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets || 'false' }}
      BUILD_WINDOWS_LOCAL: ${{ inputs.build_windows_local || 'false' }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REQUESTED_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate ref, version, and commit
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag="pr-${PULL_REQUEST_NUMBER}"
            if [[ "$REQUESTED_REF" != "$head_commit" ]]; then
              echo "Checked-out commit $head_commit does not match PR head $REQUESTED_REF" >&2
              exit 1
            fi
          else
            tag="$REQUESTED_REF"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a stable release tag in the form vX.Y.Z, got: $tag" >&2
              exit 1
            fi
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match pyproject.toml version $version" >&2
              exit 1
            fi

            tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || {
              echo "No Git tag named $tag exists" >&2
              exit 1
            }
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Checked-out commit $head_commit does not match $tag ($tag_commit)" >&2
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
              echo "Release tags must be annotated and contain update notes" >&2
              exit 1
            fi
          fi

          publish=false
          clobber=false
          build_windows_local=false
          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish=true
          elif [[ "$UPLOAD_TO_RELEASE" == "true" ]]; then
            publish=true
            clobber="$REPLACE_EXISTING_ASSETS"
          fi
          # Published releases always include the Local package: installed Local
          # Whisper apps only accept that variant from the updater.
          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            build_windows_local=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BUILD_WINDOWS_LOCAL" == "true" ]]; then
            build_windows_local=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$head_commit"
            echo "publish=$publish"
            echo "clobber=$clobber"
            echo "build_windows_local=$build_windows_local"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Installer build"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Version: \`$version\`"
            echo "- Commit: \`$head_commit\`"
            echo "- Upload to release: \`$publish\`"
            echo "- Local Whisper installer: \`$build_windows_local\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: Build macOS DMG (arm64)
    needs: metadata
    runs-on: macos-14
    timeout-minutes: 60
    # The signing secrets live only in this environment, which admits master and
    # v* tags. Pull request builds never receive them and are ad-hoc signed.
    environment: ${{ needs.metadata.outputs.publish == 'true' && 'macos-signing' || '' }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      PUBLISH: ${{ needs.metadata.outputs.publish }}
      # SHA-1 of the "PulseScribe Code Signing" certificate. macOS keeps
      # privacy permissions across updates only while every release is signed
      # with this certificate; changing it makes users grant them again.
      MACOS_SIGNING_CERT_SHA1: 7241EB994E2F876853BEEE24D56EF802F9AE2AB0

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Import stable signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::MACOS_CERTIFICATE_P12 is required: ad-hoc releases make users grant permissions again"
              exit 1
            fi
            echo "::warning::No signing certificate available; this build is ad-hoc signed"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/signing.p12"
          trap 'rm -f "$certificate"' EXIT

          security create-keychain -p "$keychain_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          read -r -a search_list <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${search_list[@]}"

          # The certificate is self-signed, so it is listed as untrusted; codesign
          # still signs with it when addressed by its SHA-1.
          if ! security find-identity -p codesigning "$keychain" | grep -Fq "$MACOS_SIGNING_CERT_SHA1"; then
            echo "::error::MACOS_CERTIFICATE_P12 does not contain the pinned certificate $MACOS_SIGNING_CERT_SHA1"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_CERT_SHA1" >> "$GITHUB_ENV"

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "build_app.spec targets arm64, but runner is $(uname -m)" >&2
            exit 1
          }
          python - <<'PY'
          import platform
          import sys

          if platform.machine() != "arm64":
              raise SystemExit(f"Expected arm64 Python, got {platform.machine()}")
          print(sys.version)
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Build app and DMG
        shell: bash
        run: ./build_app.sh --clean --dmg

      - name: Validate DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/PulseScribe-${VERSION}.dmg"
          app_binary="PulseScribe.app/Contents/MacOS/pulsescribe"

          [[ -s "$dmg" ]] || {
            echo "Missing or empty DMG: $dmg" >&2
            exit 1
          }
          hdiutil verify "$dmg"

          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"

          [[ -d "$mount_point/PulseScribe.app" ]]
          codesign --verify --deep --strict "$mount_point/PulseScribe.app"
          if [[ -n "${CODESIGN_IDENTITY:-}" || "$PUBLISH" == "true" ]]; then
            # Permissions survive updates only when macOS identifies the app by
            # the pinned certificate instead of this build's hash.
            requirement="$(codesign -d -r- "$mount_point/PulseScribe.app" 2>&1)"
            certificate_hash="$(tr '[:upper:]' '[:lower:]' <<< "$MACOS_SIGNING_CERT_SHA1")"
            expected="designated => identifier \"com.kliebhan.pulsescribe\" and certificate leaf = H\"$certificate_hash\""
            if ! grep -Fxq "$expected" <<< "$requirement"; then
              echo "App is not signed with the pinned certificate:" >&2
              echo "$requirement" >&2
              exit 1
            fi
          fi
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$mount_point/PulseScribe.app/Contents/Info.plist")"
          [[ "$bundle_version" == "$VERSION" ]] || {
            echo "Bundle version $bundle_version does not match $VERSION" >&2
            exit 1
          }
          file "$mount_point/$app_binary" | grep -q 'arm64'
          "$mount_point/$app_binary" --check-mlx-backend

          hdiutil detach "$mount_point"
          trap - EXIT
          rmdir "$mount_point"

          (
            cd dist
            shasum -a 256 "PulseScribe-${VERSION}.dmg" > "PulseScribe-${VERSION}.dmg.sha256"
          )

      - name: Record build environment
        shell: bash
        run: |
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$RELEASE_COMMIT"
            echo "version=$VERSION"
            echo "runner=$(sw_vers -productVersion) $(uname -m)"
            echo "python=$(python --version 2>&1)"
            echo "pyinstaller=$(pyinstaller --version)"
            echo
            python -m pip freeze
          } > dist/build-metadata-macos.txt

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulseScribe-macOS-${{ needs.metadata.outputs.version }}
          path: |
            dist/PulseScribe-${{ needs.metadata.outputs.version }}.dmg
            dist/PulseScribe-${{ needs.metadata.outputs.version }}.dmg.sha256
            dist/build-metadata-macos.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build Windows installer (API-only)
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API-only build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip

          # The recommended cloud build excludes local Whisper backends. Avoid
          # downloading their multi-gigabyte build dependencies on this runner.
          $cloudRequirements = Join-Path $env:RUNNER_TEMP "requirements-windows-cloud.txt"
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^(openai-whisper|faster-whisper|lightning-whisper-mlx)([<>=; ]|$)' } |
            Set-Content -Path $cloudRequirements -Encoding utf8

          python -m pip install -r $cloudRequirements "pyinstaller>=6,<7" "PySide6>=6,<7"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $knownPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not ($knownPaths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Inno Setup"
            }
          }

      - name: Build Windows installer
        shell: pwsh
        run: ./build_windows.ps1 -Clean -Installer

      - name: Check the packaged update window process
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The windowed (console=False) EXE must talk to the daemon over its
          # stdin/stdout pipes: it reports "ready" and exits when stdin closes.
          import json, queue, subprocess, threading

          process = subprocess.Popen(
              [r"dist\PulseScribe\PulseScribe.exe", "--update-window"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          lines = queue.Queue()
          threading.Thread(
              target=lambda: [lines.put(line) for line in process.stdout], daemon=True
          ).start()
          view = {"headline": "CI", "notes": "Notes", "progress": 50, "primary_label": "Install"}
          process.stdin.write((json.dumps({"view": view, "activate": False}) + "\n").encode())
          process.stdin.flush()
          try:
              while True:
                  line = lines.get(timeout=90)
                  if line.startswith(b"PULSESCRIBE-UPDATE ") and b'"ready"' in line:
                      break
          except queue.Empty:
              process.kill()
              raise SystemExit(f"No ready message: {process.stderr.read()[-2000:]!r}")
          assert process.poll() is None, "update window exited after ready"
          process.stdin.close()
          code = process.wait(timeout=30)
          assert code == 0, f"update window exit code {code}"
          print("Packaged update window: ready over stdout, exits on stdin EOF")

      - name: Validate Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist\PulseScribe-Setup-$env:VERSION.exe"
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Missing installer: $installer"
          }

          $file = Get-Item $installer
          if ($file.Length -le 0) {
            throw "Installer is empty: $installer"
          }
          $expectedFileVersion = "$env:VERSION.0"
          $actualFileVersion = $file.VersionInfo.FileVersion.Trim()
          if ($actualFileVersion -ne $expectedFileVersion) {
            throw "Installer file version '$actualFileVersion' does not match '$expectedFileVersion'"
          }

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$installer.sha256" -Value "$hash  $($file.Name)" -Encoding utf8

      - name: Record build environment
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_TAG"
            "commit=$env:RELEASE_COMMIT"
            "version=$env:VERSION"
            "runner=$([System.Environment]::OSVersion.VersionString)"
            "python=$(python --version 2>&1)"
            "pyinstaller=$(python -m PyInstaller --version)"
            ""
            $(python -m pip freeze)
          ) | Set-Content -Path dist\build-metadata-windows.txt -Encoding utf8

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulseScribe-Windows-${{ needs.metadata.outputs.version }}
          path: |
            dist/PulseScribe-Setup-${{ needs.metadata.outputs.version }}.exe
            dist/PulseScribe-Setup-${{ needs.metadata.outputs.version }}.exe.sha256
            dist/build-metadata-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows-local:
    name: Build Windows installer (Local Whisper)
    needs: metadata
    if: needs.metadata.outputs.build_windows_local == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Local Whisper build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7" "PySide6>=6,<7"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $knownPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not ($knownPaths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Inno Setup"
            }
          }

      - name: Build Local Whisper installer
        shell: pwsh
        run: ./build_windows.ps1 -Clean -Installer -Local

      - name: Validate Local Whisper installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist\PulseScribe-Setup-$env:VERSION-Local.exe"
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Missing installer: $installer"
          }

          $file = Get-Item $installer
          if ($file.Length -le 0) {
            throw "Installer is empty: $installer"
          }
          $expectedFileVersion = "$env:VERSION.0"
          $actualFileVersion = $file.VersionInfo.FileVersion.Trim()
          if ($actualFileVersion -ne $expectedFileVersion) {
            throw "Installer file version '$actualFileVersion' does not match '$expectedFileVersion'"
          }

          $bundleRoot = "dist\PulseScribe"
          foreach ($packageDirectory in @("_internal\faster_whisper", "_internal\ctranslate2", "_internal\torch")) {
            $path = Join-Path $bundleRoot $packageDirectory
            if (-not (Test-Path $path -PathType Container)) {
              throw "Local Whisper package missing from build: $path"
            }
          }

          $archivePath = "dist\PulseScribe-Setup-$env:VERSION-Local.zip"
          $maximumReleaseAssetBytes = 1900MB
          if ($file.Length -ge $maximumReleaseAssetBytes) {
            throw "Local installer is $($file.Length) bytes and exceeds the $maximumReleaseAssetBytes-byte release budget"
          }

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$installer.sha256" -Value "$hash  $($file.Name)" -Encoding utf8

          if (Test-Path $archivePath) {
            Remove-Item -Force $archivePath
          }
          Compress-Archive -Path $installer -DestinationPath $archivePath -CompressionLevel NoCompression

          $archive = Get-Item $archivePath
          if ($archive.Length -gt $maximumReleaseAssetBytes) {
            throw "Local installer archive is $($archive.Length) bytes and exceeds the $maximumReleaseAssetBytes-byte release budget"
          }

          $archiveHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$archivePath.sha256" -Value "$archiveHash  $($archive.Name)" -Encoding utf8

      - name: Record Local Whisper build environment
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_TAG"
            "commit=$env:RELEASE_COMMIT"
            "version=$env:VERSION"
            "variant=local-whisper"
            "runner=$([System.Environment]::OSVersion.VersionString)"
            "python=$(python --version 2>&1)"
            "pyinstaller=$(python -m PyInstaller --version)"
            ""
            $(python -m pip freeze)
          ) | Set-Content -Path dist\build-metadata-windows-local.txt -Encoding utf8

      - name: Upload Local Whisper build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulseScribe-Windows-Local-${{ needs.metadata.outputs.version }}
          path: |
            dist/PulseScribe-Setup-${{ needs.metadata.outputs.version }}-Local.zip
            dist/PulseScribe-Setup-${{ needs.metadata.outputs.version }}-Local.zip.sha256
            dist/PulseScribe-Setup-${{ needs.metadata.outputs.version }}-Local.exe.sha256
            dist/build-metadata-windows-local.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Attach installers to GitHub release
    needs: [metadata, build-macos, build-windows, build-windows-local]
    if: needs.metadata.outputs.publish == 'true' && (always() && !failure() && !cancelled())
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
      CLOBBER: ${{ needs.metadata.outputs.clobber }}
      LOCAL_INSTALLER: ${{ needs.metadata.outputs.build_windows_local }}

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PulseScribe-*
          path: release-assets
          merge-multiple: true

      - name: Check out release tag for annotated update notes
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          path: release-source
          fetch-depth: 0

      - name: Verify and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          dmg="release-assets/PulseScribe-${VERSION}.dmg"
          installer="release-assets/PulseScribe-Setup-${VERSION}.exe"
          [[ -s "$dmg" ]]
          [[ -s "$installer" ]]

          (
            cd release-assets
            assets=(
              "PulseScribe-${VERSION}.dmg"
              "PulseScribe-Setup-${VERSION}.exe"
            )
            if [[ "$LOCAL_INSTALLER" == "true" ]]; then
              local_installer="PulseScribe-Setup-${VERSION}-Local.zip"
              [[ -s "$local_installer" ]]
              assets+=("$local_installer")
            fi
            sha256sum "${assets[@]}" > SHA256SUMS.txt
          )

      - name: Upload assets and publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          clobber="$CLOBBER"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
              [[ "$draft" == "true" ]] || {
                echo "Release $RELEASE_TAG is already published" >&2
                exit 1
              }
            else
              git -C release-source for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > release-notes.txt
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
                --draft --title "PulseScribe $RELEASE_TAG" --notes-file release-notes.txt
            fi
            # A rerun may replace partial draft uploads; published assets stay guarded.
            clobber=true
          else
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          files=(
            "release-assets/PulseScribe-${VERSION}.dmg"
            "release-assets/PulseScribe-Setup-${VERSION}.exe"
            "release-assets/SHA256SUMS.txt"
          )
          if [[ "${LOCAL_INSTALLER:-false}" == "true" ]]; then
            files+=("release-assets/PulseScribe-Setup-${VERSION}-Local.zip")
          fi

          if [[ "$clobber" != "true" ]]; then
            existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if grep -Fxq "$name" <<< "$existing"; then
                echo "Release asset already exists: $name" >&2
                echo "Use a manual run with replace_existing_assets=true to replace it." >&2
                exit 1
              fi
            done
          fi

          args=(release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
          if [[ "$clobber" == "true" ]]; then
            args+=(--clobber)
          fi
          gh "${args[@]}" "${files[@]}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if ! latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>latest-error.txt)"; then
              if grep -Fq '(HTTP 404)' latest-error.txt; then
                latest_tag=""
              else
                cat latest-error.txt >&2
                exit 1
              fi
            fi
            make_latest="$(PYTHONPATH=release-source python - "$VERSION" "$latest_tag" <<'PY'
          import sys
          from utils.updates import version_tuple

          print(str(not sys.argv[2] or version_tuple(sys.argv[1]) > version_tuple(sys.argv[2].removeprefix("v"))).lower())
          PY
            )"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
          fi
