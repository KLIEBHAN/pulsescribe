[workspace]
resolver = "3"
members = ["crates/core", "crates/audio", "crates/providers", "crates/local-asr", "crates/platform", "crates/daemon", "crates/overlay", "crates/cli", "apps/desktop"]

[workspace.package]
version = "2.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KLIEBHAN/pulsescribe"

[workspace.dependencies]
arboard = { version = "3", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hound = "3.5"
libloading = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSButton", "NSButtonCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSLayoutConstraint", "NSPanel", "NSParagraphStyle", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AudioServices", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAAnimation", "CAGradientLayer", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "json", "multipart", "stream"] }
ringbuf = "0.6"
rubato = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "wav", "pcm", "mp3", "id3v2", "aac", "isomp4", "ogg", "vorbis", "flac"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-build = { version = "2", features = [] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
whisper-rs = "0.16"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
