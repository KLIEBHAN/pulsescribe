<!doctype html>
<html lang="en" data-theme="system" data-accent="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PulseScribe</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Inline SVG icon sprite based on Lucide Icons (https://lucide.dev, ISC License) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
      <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
      <line x1="12" x2="12" y1="19" y2="22" />
    </symbol>
    <symbol id="ic-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="21" x2="14" y1="4" y2="4" /><line x1="10" x2="3" y1="4" y2="4" />
      <line x1="21" x2="12" y1="12" y2="12" /><line x1="8" x2="3" y1="12" y2="12" />
      <line x1="21" x2="16" y1="20" y2="20" /><line x1="12" x2="3" y1="20" y2="20" />
      <line x1="14" x2="14" y1="2" y2="6" /><line x1="8" x2="8" y1="10" y2="14" />
      <line x1="16" x2="16" y1="18" y2="22" />
    </symbol>
    <symbol id="ic-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="16" height="16" x="4" y="4" rx="2" />
      <rect width="6" height="6" x="9" y="9" rx="1" />
      <path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2" />
    </symbol>
    <symbol id="ic-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
    </symbol>
    <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
    </symbol>
    <symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
    </symbol>
    <symbol id="ic-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
    </symbol>
    <symbol id="ic-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
    </symbol>
    <symbol id="ic-panel-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" />
    </symbol>
    <symbol id="ic-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" />
    </symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
    </symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
    </symbol>
    <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
    </symbol>
    <symbol id="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </symbol>
    <symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
      <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
    </symbol>
    <symbol id="ic-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
    </symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
      <path d="M21 3v5h-5" />
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
      <path d="M8 16H3v5" />
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
    </symbol>
    <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5" />
    </symbol>
    <symbol id="ic-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" />
    </symbol>
    <symbol id="ic-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" /><path d="m6 6 12 12" />
    </symbol>
    <symbol id="ic-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6" />
    </symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    </symbol>
    <symbol id="ic-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6 3 20 12 6 21 6 3" />
    </symbol>
    <symbol id="ic-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="5" y="5" rx="2" />
    </symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14" /><path d="M12 5v14" />
    </symbol>
  </svg>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="ic"><use href="#ic-mic" /></svg>
          </span>
          <span class="brand-name">PulseScribe</span>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="btn-toggle-sidebar"
          aria-label="Hide sidebar"
          aria-expanded="true"
          title="Hide sidebar"
        >
          <svg class="ic"><use href="#ic-panel-left" /></svg>
        </button>
      </div>

      <nav class="nav-list" id="nav-list">
        <button type="button" class="nav-item" data-route="general">
          <svg class="ic"><use href="#ic-sliders" /></svg>
          <span class="nav-label">General</span>
        </button>
        <button type="button" class="nav-item" data-route="models">
          <svg class="ic"><use href="#ic-cpu" /></svg>
          <span class="nav-label">Local Models</span>
        </button>
        <button type="button" class="nav-item" data-route="prompts">
          <svg class="ic"><use href="#ic-sparkles" /></svg>
          <span class="nav-label">Prompts</span>
        </button>
        <button type="button" class="nav-item" data-route="vocabulary">
          <svg class="ic"><use href="#ic-book" /></svg>
          <span class="nav-label">Vocabulary</span>
        </button>
        <button type="button" class="nav-item" data-route="history">
          <svg class="ic"><use href="#ic-clock" /></svg>
          <span class="nav-label">History</span>
        </button>
        <div class="nav-sep" role="separator"></div>
        <button type="button" class="nav-item" data-route="onboarding">
          <svg class="ic"><use href="#ic-compass" /></svg>
          <span class="nav-label">Setup Wizard</span>
        </button>
        <button type="button" class="nav-item" data-route="diagnostics" id="nav-diagnostics">
          <svg class="ic"><use href="#ic-activity" /></svg>
          <span class="nav-label">Diagnostics</span>
          <span class="nav-dot" id="nav-status-dot" aria-hidden="true"></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="segmented" role="group" aria-label="Color mode">
          <button type="button" class="seg-btn" data-theme-choice="system" aria-label="System theme" title="System">
            <svg class="ic ic-sm"><use href="#ic-monitor" /></svg>
            <span>System</span>
          </button>
          <button type="button" class="seg-btn" data-theme-choice="light" aria-label="Light theme" title="Light">
            <svg class="ic ic-sm"><use href="#ic-sun" /></svg>
            <span>Light</span>
          </button>
          <button type="button" class="seg-btn" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
            <svg class="ic ic-sm"><use href="#ic-moon" /></svg>
            <span>Dark</span>
          </button>
        </div>
        <div class="accent-row">
          <span class="accent-label">Accent</span>
          <div class="segmented segmented-sm" role="group" aria-label="Accent color">
            <button type="button" class="seg-btn" data-accent-choice="blue">Blue</button>
            <button type="button" class="seg-btn" data-accent-choice="mono">Mono</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="icon-btn topbar-expand-btn"
            id="btn-expand-sidebar"
            aria-label="Show sidebar"
            aria-expanded="false"
            title="Show sidebar"
          >
            <svg class="ic"><use href="#ic-panel-left" /></svg>
          </button>
          <h1 class="page-title" id="page-title">General</h1>
          <span class="badge badge-neutral" id="daemon-badge">Ready</span>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <div class="surface">
        <div class="error-banner" id="error-banner" role="alert" hidden>
          <svg class="ic"><use href="#ic-alert" /></svg>
          <span class="error-banner-text" id="error-banner-text"></span>
          <button type="button" class="icon-btn" id="btn-dismiss-error" aria-label="Dismiss error">
            <svg class="ic ic-sm"><use href="#ic-x" /></svg>
          </button>
        </div>

        <main class="content" id="view-root" tabindex="-1"></main>

        <footer class="sticky-save-bar" id="sticky-save-bar" hidden>
          <div class="sticky-save-info">
            <span class="unsaved-dot" aria-hidden="true"></span>
            <span id="sticky-save-label">Unsaved changes</span>
          </div>
          <div class="sticky-save-actions">
            <button type="button" class="btn btn-ghost" id="btn-discard-changes">Discard</button>
            <button type="button" class="btn btn-primary" id="btn-save-changes">Save changes</button>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <nav class="mobile-tabs" id="mobile-tabs" aria-label="Primary navigation">
    <button type="button" class="mobile-tab" data-route="general">
      <svg class="ic"><use href="#ic-sliders" /></svg><span>General</span>
    </button>
    <button type="button" class="mobile-tab" data-route="models">
      <svg class="ic"><use href="#ic-cpu" /></svg><span>Models</span>
    </button>
    <button type="button" class="mobile-tab" data-route="prompts">
      <svg class="ic"><use href="#ic-sparkles" /></svg><span>Prompts</span>
    </button>
    <button type="button" class="mobile-tab" data-route="vocabulary">
      <svg class="ic"><use href="#ic-book" /></svg><span>Vocab</span>
    </button>
    <button type="button" class="mobile-tab" data-route="history">
      <svg class="ic"><use href="#ic-clock" /></svg><span>History</span>
    </button>
    <button type="button" class="mobile-tab" data-route="onboarding">
      <svg class="ic"><use href="#ic-compass" /></svg><span>Setup</span>
    </button>
    <button type="button" class="mobile-tab" data-route="diagnostics">
      <svg class="ic"><use href="#ic-activity" /></svg><span>Status</span>
    </button>
  </nav>

  <dialog class="confirm-dialog" id="confirm-dialog" tabindex="-1" aria-labelledby="confirm-title">
    <div class="dialog-head">
      <h2 id="confirm-title">Confirm</h2>
    </div>
    <p class="dialog-body" id="confirm-message"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </dialog>

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
