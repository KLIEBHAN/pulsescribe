[package]
name = "pulsescribe-overlay"
description = "Native 60 FPS non-activating floating recording overlay for PulseScribe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pulsescribe-core = { path = "../core" }
pulsescribe-daemon = { path = "../daemon" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
