[package]
name = "pulsescribe-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard.workspace = true
pulsescribe-core = { path = "../core" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-audio-toolbox.workspace = true
objc2-av-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Security"] }

# Scoped `deny` (instead of workspace `forbid`) so native OS FFI adapters may use
# targeted `#[allow(unsafe_code)]` blocks with documented `// SAFETY:` invariants.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
