[package]
name = "pulsescribe-local-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
local-whisper = ["dep:whisper-rs"]
local-sherpa = ["dep:libloading"]
all-local = ["local-whisper", "local-sherpa"]

[dependencies]
futures-util.workspace = true
libloading = { workspace = true, optional = true }
pulsescribe-core = { path = "../core" }
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
whisper-rs = { workspace = true, optional = true, features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["metal", "tracing_backend"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
